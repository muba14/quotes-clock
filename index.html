<style>
/* Layout: tek ekranlık telefon uygulaması — kaydırılan içerik üstte, iki sekmeli çubuk altta. Tek (siyah) tema. */
:root{
  color-scheme:dark;
  --bg:#020308;          /* siyah zemin */
  --surface:#080d1f;     /* lacivert-siyah yüzey */
  --surface-2:#0f1733;   /* yükseltilmiş yüzey */
  --line:#1a2548;        /* ince çizgi */
  --navy:#1c2f7a;        /* ana lacivert */
  --navy-strong:#2a44b8; /* dolu düğme */
  --accent:#93a8ff;      /* lacivert üstünde okunur açık ton */
  --rest:#7fd0e6;        /* mola evresi */
  --fg:#e8ecfb;
  --muted:#8690b4;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:
  radial-gradient(120% 55% at 50% -10%,#101b4a 0%,transparent 70%) no-repeat,var(--bg)}
main{flex:1;min-height:0;overflow-y:auto;padding-inline:20px;padding-block:24px 28px}
.view{display:flex;flex-direction:column;gap:22px}

.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-size:26px;font-weight:500;margin:2px 0 0;text-wrap:balance}

/* Öne çıkan söz */
.feature{background:linear-gradient(160deg,var(--navy) 0%,#0d1640 60%,var(--surface) 100%);border:1px solid #2b3d8a;border-radius:22px;padding:26px 22px 18px;display:flex;flex-direction:column;gap:16px}
.feature .mark{font-family:var(--serif);font-size:54px;line-height:.5;color:var(--accent);height:22px}
.feature blockquote{margin:0;font-family:var(--serif);font-style:italic;font-size:25px;line-height:1.35;text-wrap:balance}
.feature cite{font-style:normal;color:var(--accent);font-size:14px;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.icon-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center}
.icon-btn svg{width:19px;height:19px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent)}
.btn{height:42px;padding:0 20px;border-radius:21px;background:var(--surface-2);border:1px solid var(--line);font-weight:500}
.btn.primary{background:var(--navy-strong);border-color:var(--navy-strong);color:#fff}
.btn.big{height:52px;border-radius:26px;min-width:140px;font-size:16px}
.btn:disabled{opacity:.4;cursor:default}
.push{margin-left:auto}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.chip[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);border-color:#2b3d8a}

.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.qlist li{border-top:1px solid var(--line)}
.qlist button{width:100%;text-align:left;padding:15px 2px;display:flex;gap:12px;align-items:flex-start}
.qlist .t{flex:1;min-width:0;font-family:var(--serif);font-size:17px;line-height:1.4}
.qlist .a{display:block;font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:4px}
.qlist .h{width:14px;height:14px;margin-top:6px;fill:var(--accent);flex:none}
.empty{color:var(--muted);padding:18px 2px;border-top:1px solid var(--line)}

/* Zaman */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px}
.seg button{height:38px;border-radius:10px;font-size:13px;color:var(--muted);position:relative}
.seg button[aria-selected="true"]{background:var(--navy);color:#fff}
.seg button.live::after,.tabs button.live::after{content:"";position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.panel{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:6px}
.digits{font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:-.01em}

.clock{font-size:clamp(64px,23vw,104px);line-height:1}
.clock small{font-size:.34em;color:var(--accent);margin-left:6px;font-weight:400}
.date{color:var(--muted);font-size:16px}
.day{width:100%;display:flex;flex-direction:column;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy-strong),var(--accent));border-radius:3px}
.day span{font-size:13px;color:var(--muted)}
.whisper{width:100%;border-top:1px solid var(--line);padding-top:18px;font-family:var(--serif);font-style:italic;font-size:18px;text-align:center;color:#c9d2f5;text-wrap:balance}

.ring{position:relative;width:min(260px,70vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .track{stroke:var(--surface-2)}
.ring .prog{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset .2s linear}
.ring.rest .prog{stroke:var(--rest)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring .digits{font-size:clamp(44px,14vw,58px);line-height:1}
.ring .sub{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ring.rest .sub{color:var(--rest)}

.fields{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);flex:1;min-width:92px}
.field input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;font-size:19px;font-variant-numeric:tabular-nums;color:var(--fg)}
.field input:disabled{opacity:.5}
.settings{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.settings h2{margin:0;font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.settings .fields{display:grid;grid-template-columns:repeat(2,1fr)}

.sw{font-size:clamp(52px,17vw,76px);line-height:1;padding-block:26px 6px}
.sw small{font-size:.5em;color:var(--accent)}
.laps{list-style:none;margin:0;padding:0;width:100%}
.laps li{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.laps li span:first-child{color:var(--muted)}
.laps li em{font-style:normal;color:var(--accent)}

.dots{display:flex;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--accent)}
.dots i.on{background:var(--accent)}
.note{font-size:13px;color:var(--muted);text-align:center}

/* Alt sekmeler */
.tabs{flex:none;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:rgba(4,7,18,.96);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:12.5px;letter-spacing:.04em;position:relative}
.tabs .pill{width:58px;height:30px;border-radius:15px;display:grid;place-items:center}
.tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:#fff}
.tabs button[aria-selected="true"] .pill{background:var(--navy)}
.tabs button.live::after{top:6px;right:calc(50% - 30px)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid #2b3d8a;padding:9px 16px;border-radius:20px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
/* Dünya saatleri haritası */
.world{width:100%;height:auto;display:block;margin-top:4px}
.world .land{fill:var(--navy);stroke:#2f469c;stroke-width:.6;stroke-linejoin:round}
.world .lead{stroke:var(--accent);stroke-width:1.6;fill:none}
.world .dot{fill:var(--accent)}
.world .halo{fill:var(--accent);opacity:.22}
.world .head{fill:var(--accent)}
.world text{font-family:var(--sans);text-anchor:middle}
.world .nm{font-size:21px;letter-spacing:.1em;fill:var(--muted)}
.world .tm{font-size:38px;font-weight:500;fill:var(--fg);font-variant-numeric:tabular-nums}

/* Açılış ekranı */
.splash{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;cursor:pointer;transition:opacity .5s ease;background:
  radial-gradient(70% 45% at 50% 50%,#13205a 0%,transparent 75%) no-repeat,var(--bg)}
.splash.out{opacity:0;pointer-events:none}
.wordmark{font-size:clamp(56px,19vw,92px);font-weight:500;letter-spacing:-.02em;line-height:1;color:var(--fg);text-align:center;white-space:nowrap}
.wordmark svg{width:.6em;height:.6em;margin:0 .03em;vertical-align:-.035em;overflow:visible}
.wordmark circle{fill:none;stroke:var(--accent);stroke-width:2.6}
.wordmark line{stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;transform-origin:12px 12px;transform:rotate(var(--a,0deg))}
.wordmark .mh{animation:sweep 1.2s cubic-bezier(.3,.7,.2,1) both}
@keyframes sweep{from{transform:rotate(calc(var(--a,0deg) - 360deg))}to{transform:rotate(var(--a,0deg))}}
@media (prefers-reduced-motion:reduce){.ring .prog,.splash{transition:none}.wordmark .mh{animation:none}}
</style>

<div class="app" lang="tr">
  <main id="main">
    <!-- SÖZLER -->
    <section class="view" id="viewQuotes">
      <header>
        <div class="eyebrow" id="qDate"></div>
        <h1 id="greet"></h1>
      </header>

      <div class="feature">
        <div class="mark" aria-hidden="true">“</div>
        <blockquote id="qText"></blockquote>
        <cite id="qAuthor"></cite>
        <div class="row">
          <button class="icon-btn" id="favBtn" aria-pressed="false" aria-label="Favorilere ekle">
            <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.6A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.4C19 15.6 12 20 12 20z"/></svg>
          </button>
          <button class="icon-btn" id="copyBtn" aria-label="Sözü kopyala">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          </button>
          <button class="btn primary push" id="nextBtn">Yeni söz</button>
        </div>
      </div>

      <div>
        <div class="chips" style="margin-bottom:12px">
          <button class="chip" id="chipAll" aria-pressed="true">Tüm sözler</button>
          <button class="chip" id="chipFav" aria-pressed="false">Favoriler</button>
        </div>
        <ul class="qlist" id="qList"></ul>
        <div class="empty" id="qEmpty" hidden>Henüz favorin yok. Beğendiğin sözde kalbe dokun.</div>
      </div>
    </section>

    <!-- ZAMAN -->
    <section class="view" id="viewTime" hidden>
      <div class="seg" role="tablist" aria-label="Zaman araçları">
        <button role="tab" data-mode="clock" aria-selected="true">Saat</button>
        <button role="tab" data-mode="timer" aria-selected="false">Süreölçer</button>
        <button role="tab" data-mode="sw" aria-selected="false">Kronometre</button>
        <button role="tab" data-mode="pomo" aria-selected="false">Pomodoro</button>
      </div>

      <div class="panel" id="p-clock">
        <div class="digits clock" id="clock" style="margin-top:28px"></div>
        <div class="date" id="cDate"></div>
        <div class="day">
          <div class="bar"><i id="dayBar"></i></div>
          <span id="dayTxt"></span>
        </div>
        <div class="day">
          <div class="bar"><i id="yearBar"></i></div>
          <span id="yearTxt"></span>

        <div class="row" style="justify-content:center">
          <button class="btn big" id="tReset">Sıfırla</button>
          <button class="btn big primary" id="tStart">Başlat</button>
        </div>
        <button class="chip" data-sound>Uyarı sesini dinle</button>
      </div>

      <div class="panel" id="p-sw" hidden>
        <div class="digits sw" id="swDigits"></div>
        <div class="row" style="justify-content:center">
          <button class="btn big" id="swLap">Tur</button>
          <button class="btn big primary" id="swStart">Başlat</button>
        </div>
        <button class="chip" id="swReset">Sıfırla</button>
        <ul class="laps" id="laps"></ul>
      </div>

      <div class="panel" id="p-pomo" hidden>
        <div class="ring" id="pRing">
          <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54"/><circle class="prog" id="pProg" cx="60" cy="60" r="54" pathLength="100"/></svg>
          <div class="in"><div class="sub" id="pPhase">Odak</div><div class="digits" id="pDigits"></div><div class="dots" id="pDots"></div></div>
        </div>
        <div class="note" id="pNote"></div>
        <div class="row" style="justify-content:center">
          <button class="btn big" id="pSkip">Atla</button>
          <button class="btn big primary" id="pStart">Başlat</button>
        </div>
        <div class="chips" style="justify-content:center">
          <button class="chip" id="pReset">Baştan başla</button>
          <button class="chip" data-sound>Uyarı sesini dinle</button>
        </div>
        <div class="settings">
          <h2>Süre ayarları</h2>
          <div class="fields">
            <label class="field">Odak (dk)<input id="sWork" type="number" inputmode="numeric" min="1" max="180"></label>
            <label class="field">Kısa mola (dk)<input id="sShort" type="number" inputmode="numeric" min="1" max="60"></label>
            <label class="field">Uzun mola (dk)<input id="sLong" type="number" inputmode="numeric" min="1" max="120"></label>
            <label class="field">Uzun mola öncesi tur<input id="sRounds" type="number" inputmode="numeric" min="1" max="12"></label>
          </div>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabs" role="tablist" aria-label="Bölümler">
    <button role="tab" id="tabQuotes" aria-selected="true">
      <span class="pill"><svg viewBox="0 0 24 24"><path d="M9 7H6a2 2 0 0 0-2 2v3h4v2a2 2 0 0 1-2 2M19 7h-3a2 2 0 0 0-2 2v3h4v2a2 2 0 0 1-2 2"/></svg></span>
      Sözler
    </button>
    <button role="tab" id="tabTime" aria-selected="false">
      <span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
      Zaman
    </button>
  </nav>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="splash" id="splash">
    <div class="wordmark" role="img" aria-label="Quotes">Qu<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5"/><line class="hh" id="spH" x1="12" y1="12" x2="12" y2="7.2"/><line class="mh" id="spM" x1="12" y1="12" x2="12" y2="4.6"/></svg>tes</div>
  </div>
</div>

<script>
(function(){
  try{document.documentElement.lang='tr'}catch(e){}
  const $=id=>document.getElementById(id);
  const load=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const setText=(el,t)=>{if(el.textContent!==t)el.textContent=t};
  const pad=n=>String(n).padStart(2,'0');
  let toastT;
  function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2200)}

  /* ---------- AÇILIŞ ---------- */
  (function(){const sp=$('splash'),d=new Date();
    $('spM').style.setProperty('--a',(d.getMinutes()*6)+'deg');
    $('spH').style.setProperty('--a',((d.getHours()%12)*30+d.getMinutes()*.5)+'deg');
    let gone=false;const close=()=>{if(gone)return;gone=true;sp.classList.add('out');setTimeout(()=>{sp.hidden=true},550)};
    sp.addEventListener('click',close);setTimeout(close,1900)})();

  /* ---------- SÖZLER ---------- */
  const QUOTES=[
    {t:"Bin millik yolculuk tek bir adımla başlar.",a:"Lao Tzu"},
    {t:"Hayatta en hakiki mürşit ilimdir.",a:"Mustafa Kemal Atatürk"},
    {t:"Ne kadar yavaş gittiğiniz önemli değildir, yeter ki durmayın.",a:"Konfüçyüs"},
    {t:"Ömür kısa değil; biz onu boşa harcıyoruz.",a:"Seneca"},
    {t:"Dün dünle beraber gitti cancağızım; şimdi yeni şeyler söylemek lazım.",a:"Mevlânâ"},
    {t:"İlim ilim bilmektir, ilim kendin bilmektir.",a:"Yunus Emre"},
    {t:"Eyleme engel olan şey, eylemi ilerletir. Yolda duran şey, yolun kendisi olur.",a:"Marcus Aurelius"},
    {t:"Şans, hazırlıklı zihinlerden yanadır.",a:"Louis Pasteur"},
    {t:"Kendini tanı.",a:"Delfi Tapınağı yazıtı"},
    {t:"Zafer, “Zafer benimdir” diyebilenindir. Başarı ise “Başaracağım” diye başlayarak sonunda “Başardım” diyebilenindir.",a:"Mustafa Kemal Atatürk"},
    {t:"Gelecek, hayallerinin güzelliğine inananlarındır.",a:"Eleanor Roosevelt"},
    {t:"Sadece sınırlarımızı zorlayarak ne kadar uzağa gidebileceğimizi keşfedebiliriz.",a:"Albert Einstein"},
    {t:"Karanlıktan korkan bir çocuğu kolayca affedebiliriz. Hayattaki gerçek trajedi, insanların ışıktan korkmasıdır.",a:"Platon"},
    {t:"Hiç kimse geriye gidip yeni bir başlangıç yapamaz; ama bugün başlayıp yeni bir son yazabilir.",a:"Carl Bard"},
    {t:"Ağaç dikmek için en iyi zaman 20 yıl öncesiydi. İkinci en iyi zaman ise şimdi.",a:"Çin Atasözü"},
    {t:"En büyük zaferimiz hiç düşmemek değil, her düştüğümüzde yeniden ayağa kalkmaktır.",a:"Konfüçyüs"},
    {t:"Yolunuzda yürürken önüne çıkan engeller, sizi durdurmak için değil; ne kadar kararlı olduğunuzu test etmek içindir.",a:"Nelson Mandela"},
    {t:"Sorgulanmamış bir yaşam, yaşanmaya değmez.",a:"Sokrates"},
    {t:"Küçük şeylerde sadık olan insan, büyük şeylerde de sadık olur.",a:"Hz. İsa"},
    {t:"Rüzgarın yönünü değiştiremem ama yelkenlerimi her zaman gideceğim yere varacak şekilde ayarlayabilirim.",a:"Jimmy Dean"},
    {t:"Başarı, gün be gün tekrarlanan küçük çabaların toplamıdır.",a:"Robert Collier"},
    {t:"Büyük işler başarmak için sadece harekete geçmek yetmez, aynı zamanda hayal de etmeliyiz; sadece planlamak yetmez, aynı zamanda inanmalıyız.",a:"Anatole France"},
    {t:"Bir insanın hayatı, onun düşüncelerinin rengine bürünür.",a:"Marcus Aurelius"},
    {t:"Başarısızlık, daha zekice başlamak için bir fırsattan başka bir şey değildir.",a:"Henry Ford"},
    {t:"Yapabileceğinizi düşünseniz de yapamayacağınızı düşünseniz de haklısınız.",a:"Henry Ford"},
    {t:"Güneşe yüzünü dönen insan, gölgeyi arkasında bırakır.",a:"Helen Keller"},
    {t:"Yarın bambaşka bir insan olacağım diyorsun. Niye bugünden başlamıyorsun?",a:"Epiktetos"},
    {t:"Sıkıntılar gece gibidir; geçer, biter. Yeter ki sen sabretmesini bil.",a:"Mevlânâ"},
    {t:"İmkanın sınırını görmek için imkansızı denemek lazım.",a:"Fatih Sultan Mehmet"},
    {t:"Zaman en adil dağıtılmış kaynaktır; herkesin gününde tam 24 saat vardır, farkı yaratan onu nasıl kullandığınızdır.",a:"Jim Rohn"},
    {t:"Başarı, doğru zamanda doğru adımı atabilme disiplinidir.",a:"Peter Drucker"},
    {t:"Ertelemek, zamanın hırsızıdır; başarı ise anı yakalayanlarındır.",a:"Edward Young"},
    {t:"Kaybedilen para tekrar kazanılabilir ama kaybedilen zaman asla geri gelmez.",a:"Benjamin Franklin"},
    {t:"Sabır ve zaman; işte benim en güçlü iki savaşçım.",a:"Lev Tolstoy"},
    {t:"Gelecek, şu an ne yaptığına bağlı olarak şekillenir.",a:"Mahatma Gandhi"},
    {t:"Başarılı insanlar zamanı satın alır, başarısız insanlar ise zamanı harcar.",a:"Warren Buffett"},
    {t:"Dün geçti, yarın henüz gelmedi, elimizde sadece bugün var. Başlamanın tam zamanı.",a:"Rahibe Teresa"},
    {t:"Kötü haber zamanın uçup gitmesidir, iyi haber ise pilotun siz olmanızdır.",a:"Michael Altshuler"},
    {t:"Büyük eserler bir anda değil, zamanın sabırla işlenmesiyle ortaya çıkar.",a:"Michelangelo"},
    {t:"Hayatını seviyorsan zamanını boşa harcama; çünkü hayat zamanın kendisidir.",a:"Bruce Lee"},
    {t:"Zamanını kontrol edemeyen, başarısını da kontrol edemez.",a:"Brian Tracy"},
    {t:"Başarı bir gecede gerçekleşmez; o, zamanla biriken binlerce gizli çabanın meyvesidir.",a:"Jeff Bezos"},
    {t:"Geçmişten ders alın, geleceğe hazırlanın, ama başarıyı “şu an” içinde inşa edin.",a:"Colin Powell"},
    {t:"Zamanın değerini bilmeyen biri, başarının tadını asla çıkaramaz.",a:"Robin Sharma"},
    {t:"Zaman, hedefleri olan insan için bir müttefik; rüzgara kapılan insan için bir düşmandır.",a:"Seneca"},
    {t:"Zafer, zamanı doğru yöneten ve fırsatı anında kavrayanlarındır.",a:"Napolyon Bonapart"},
    {t:"Başarının sırrı, sıradan şeyleri zaman içinde olağanüstü bir tutarlılıkla yapmaktır.",a:"John C. Maxwell"},
    {t:"Bugünün bir saati, yarının iki saatine bedeldir.",a:"Thomas Fuller"},
    {t:"Neden azmin bu kadar süreksiz? Sen mi, yoksa davan mı yüreksiz?",a:"Mehmet Akif Ersoy"}
  ];
  const now0=new Date();
  const dayOfYear=Math.floor((now0-new Date(now0.getFullYear(),0,0))/864e5);
  let cur=dayOfYear%QUOTES.length;
  let favs=load('qc.favs',[]); if(!Array.isArray(favs))favs=[];
  let onlyFav=false;
  const isFav=q=>favs.indexOf(q.t)>-1;

  function renderFeature(){
    const q=QUOTES[cur];
    $('qText').textContent=q.t; $('qAuthor').textContent='— '+q.a;
    const f=isFav(q); $('favBtn').setAttribute('aria-pressed',f);
    $('favBtn').setAttribute('aria-label',f?'Favorilerden çıkar':'Favorilere ekle');
  }
  function renderList(){
    const ul=$('qList'); ul.textContent='';
    let n=0;
    QUOTES.forEach((q,i)=>{
      if(onlyFav&&!isFav(q))return; n++;
      const li=document.createElement('li'),b=document.createElement('button');
      const s=document.createElement('span');s.className='t';s.textContent=q.t;
      const a=document.createElement('span');a.className='a';a.textContent=q.a;s.appendChild(a);
      b.appendChild(s);
      if(isFav(q)){const ns='http://www.w3.org/2000/svg',sv=document.createElementNS(ns,'svg'),p=document.createElementNS(ns,'path');
        sv.setAttribute('viewBox','0 0 24 24');sv.setAttribute('class','h');p.setAttribute('d','M12 20s-7-4.4-7-9.6A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.4C19 15.6 12 20 12 20z');sv.appendChild(p);b.appendChild(sv)}
      b.addEventListener('click',()=>{cur=i;renderFeature();$('main').scrollTo({top:0,behavior:'smooth'})});
      li.appendChild(b);ul.appendChild(li);
    });
    $('qEmpty').hidden=n>0;
  }
  $('nextBtn').addEventListener('click',()=>{let n;do{n=Math.floor(Math.random()*QUOTES.length)}while(n===cur);cur=n;renderFeature()});
  $('favBtn').addEventListener('click',()=>{const q=QUOTES[cur],i=favs.indexOf(q.t);if(i>-1)favs.splice(i,1);else favs.push(q.t);save('qc.favs',favs);renderFeature();renderList()});
  $('copyBtn').addEventListener('click',()=>{const q=QUOTES[cur];
    try{navigator.clipboard.writeText('“'+q.t+'” — '+q.a).then(()=>toast('Kopyalandı'),()=>toast('Kopyalanamadı, metni seçip kopyalayabilirsin'))}
    catch(e){toast('Kopyalanamadı, metni seçip kopyalayabilirsin')}});
  function setFilter(f){onlyFav=f;$('chipAll').setAttribute('aria-pressed',!f);$('chipFav').setAttribute('aria-pressed',f);renderList()}
  $('chipAll').addEventListener('click',()=>setFilter(false));
  $('chipFav').addEventListener('click',()=>setFilter(true));

  /* ---------- SEKME / MOD ---------- */
  let tab='quotes',mode='clock';
  function showTab(t){tab=t;$('viewQuotes').hidden=t!=='quotes';$('viewTime').hidden=t!=='time';
    $('tabQuotes').setAttribute('aria-selected',t==='quotes');$('tabTime').setAttribute('aria-selected',t==='time');
    $('main').scrollTop=0;save('qc.tab',t)}
  const segBtns=[].slice.call(document.querySelectorAll('.seg button'));
  function showMode(m){mode=m;['clock','timer','sw','pomo'].forEach(k=>{$('p-'+k).hidden=k!==m});
    segBtns.forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===m));save('qc.mode',m)}
  $('tabQuotes').addEventListener('click',()=>showTab('quotes'));
  $('tabTime').addEventListener('click',()=>showTab('time'));
  segBtns.forEach(b=>b.addEventListener('click',()=>showMode(b.dataset.mode)));

  /* ---------- SES ---------- */
  let ac;
  function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
  /* Çan tınılı, yükselen dört notalık melodi (Do–Mi–Sol–Do), iki kez çalar */
  function beep(){if(!ac)return;try{
    const t0=ac.currentTime+.03,master=ac.createGain();master.gain.value=.55;master.connect(ac.destination);
    [0,1.5].forEach(rep=>{[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const t=t0+rep+i*.16;
      [[1,.22],[2,.07],[3,.025]].forEach(h=>{const o=ac.createOscillator(),g=ac.createGain();
        o.type='sine';o.frequency.value=f*h[0];
        g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(h[1],t+.012);
        g.gain.exponentialRampToValueAtTime(.0001,t+.2+1.3/h[0]);
        o.connect(g);g.connect(master);o.start(t);o.stop(t+1.6)})})});
  }catch(e){}}
  document.querySelectorAll('[data-sound]').forEach(b=>b.addEventListener('click',()=>{unlock();beep()}));

  function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
    return h?h+':'+pad(m)+':'+pad(x):pad(m)+':'+pad(x)}
  function ring(el,frac){el.style.strokeDashoffset=String(100*(1-Math.min(1,Math.max(0,frac))))}
  function num(el,min,max,def){let v=parseInt(el.value,10);if(isNaN(v))v=def;return Math.min(max,Math.max(min,v))}

  /* ---------- SÜREÖLÇER (geri sayım) ---------- */
  const T={dur:300000,remain:300000,endAt:0,running:false,done:false};
  function tApply(){if(T.running)return;T.dur=(num($('tMin'),0,599,0)*60+num($('tSec'),0,59,0))*1000;T.remain=T.dur;T.done=false}
  $('tMin').addEventListener('input',tApply);$('tSec').addEventListener('input',tApply);
  document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{if(T.running)return;$('tMin').value=b.dataset.preset;$('tSec').value=0;tApply()}));
  $('tStart').addEventListener('click',()=>{unlock();
    if(T.running){T.remain=Math.max(0,T.endAt-Date.now());T.running=false;return}
    if(T.remain<=0)T.remain=T.dur;
    if(T.dur<=0){toast('Önce bir süre gir');return}
    T.done=false;T.endAt=Date.now()+T.remain;T.running=true});
  $('tReset').addEventListener('click',()=>{T.running=false;T.done=false;T.remain=T.dur});

  /* ---------- KRONOMETRE ---------- */
  const S={acc:0,startAt:0,running:false,laps:[]};
  const sElapsed=()=>S.acc+(S.running?Date.now()-S.startAt:0);
  function fmtSw(ms){const c=Math.floor(ms/10)%100,s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
    return [(h?h+':':'')+pad(m)+':'+pad(x),'.'+pad(c)]}
  function renderLaps(){const ul=$('laps');ul.textContent='';
    for(let i=S.laps.length-1;i>=0;i--){const prev=i?S.laps[i-1]:0,li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('em'),c=document.createElement('span');
      a.textContent='Tur '+(i+1);b.textContent='+'+fmtSw(S.laps[i]-prev).join('');c.textContent=fmtSw(S.laps[i]).join('');
      li.appendChild(a);li.appendChild(b);li.appendChild(c);ul.appendChild(li)}}
  $('swStart').addEventListener('click',()=>{if(S.running){S.acc=sElapsed();S.running=false}else{S.startAt=Date.now();S.running=true}});
  $('swLap').addEventListener('click',()=>{if(!S.running)return;S.laps.push(sElapsed());renderLaps()});
  $('swReset').addEventListener('click',()=>{S.acc=0;S.running=false;S.laps=[];renderLaps()});

  /* ---------- POMODORO ---------- */
  const cfg=Object.assign({work:25,short:5,long:15,rounds:4},load('qc.pomo',{}));
  const P={phase:'work',round:1,done:0,remain:0,endAt:0,running:false};
  const PH={work:'Odak',short:'Kısa mola',long:'Uzun mola'};
  const pDur=()=>cfg[P.phase]*60000;
  P.remain=pDur();
  $('sWork').value=cfg.work;$('sShort').value=cfg.short;$('sLong').value=cfg.long;$('sRounds').value=cfg.rounds;
  function pSettings(){cfg.work=num($('sWork'),1,180,25);cfg.short=num($('sShort'),1,60,5);cfg.long=num($('sLong'),1,120,15);cfg.rounds=num($('sRounds'),1,12,4);
    save('qc.pomo',cfg);if(P.round>cfg.rounds)P.round=cfg.rounds;if(!P.running)P.remain=pDur();pDots()}
  ['sWork','sShort','sLong','sRounds'].forEach(id=>$(id).addEventListener('input',pSettings));
  function pDots(){const d=$('pDots');d.textContent='';for(let i=1;i<=cfg.rounds;i++){const e=document.createElement('i');
    if(i<P.round||(i===P.round&&P.phase!=='work'))e.className='on';d.appendChild(e)}}
  function pAdvance(finished){
    if(P.phase==='work'){if(finished)P.done++;P.phase=P.round>=cfg.rounds?'long':'short'}
    else{P.round=P.phase==='long'?1:P.round+1;P.phase='work'}
    P.remain=pDur();if(P.running)P.endAt=Date.now()+P.remain;pDots();
    if(finished){beep();toast(P.phase==='work'?'Mola bitti, odak zamanı':'Odak tamamlandı, mola zamanı')}}
  $('pStart').addEventListener('click',()=>{unlock();
    if(P.running){P.remain=Math.max(0,P.endAt-Date.now());P.running=false}
    else{P.endAt=Date.now()+P.remain;P.running=true}});
  $('pSkip').addEventListener('click',()=>pAdvance(false));
  $('pReset').addEventListener('click',()=>{P.running=false;P.phase='work';P.round=1;P.done=0;P.remain=pDur();pDots()});

  /* Sayının okunuşuna göre iyelik eki: %79’u, %50’si, %6’sı */
  function ek(n){if(n===0)return '’ı';if(n===100)return '’ü';
    const b=n%10;return b?['','’i','’si','’ü','’ü','’i','’sı','’si','’i','’u'][b]:['','’u','’si','’u','’ı','’si','’ı','’i','’i','’ı'][n/10]}

  /* ---------- DÖNGÜ ---------- */
  let lastMin=-1;
  function tick(){
    const now=Date.now();
    if(T.running&&T.endAt-now<=0){T.running=false;T.remain=0;T.done=true;beep();toast('Süre doldu')}
    if(P.running&&P.endAt-now<=0)pAdvance(true);

    $('tabTime').classList.toggle('live',T.running||S.running||P.running);
    segBtns[1].classList.toggle('live',T.running);segBtns[2].classList.toggle('live',S.running);segBtns[3].classList.toggle('live',P.running);
    if(tab!=='time')return;

    if(mode==='clock'){
      const d=new Date(now),c=$('clock'),hm=pad(d.getHours())+':'+pad(d.getMinutes()),ss=pad(d.getSeconds());
      if(c.dataset.v!==hm+ss){c.dataset.v=hm+ss;c.textContent=hm;const sm=document.createElement('small');sm.textContent=ss;c.appendChild(sm)}
      if(d.getMinutes()!==lastMin){lastMin=d.getMinutes();
        setText($('cDate'),d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',weekday:'long'}));
        const fr=(d-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5,pc=Math.round(fr*100);
        $('dayBar').style.width=pc+'%';setText($('dayTxt'),'Günün %'+pc+ek(pc)+' geride kaldı, %'+(100-pc)+ek(100-pc)+' senin.');
        const y=d.getFullYear(),y0=new Date(y,0,1),yp=Math.floor((d-y0)/(new Date(y+1,0,1)-y0)*100);
        document.querySelectorAll('[data-tz]').forEach(el=>{try{setText(el,d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',timeZone:el.dataset.tz}))}catch(e){setText(el,'--:--')}});
        $('yearBar').style.width=yp+'%';setText($('yearTxt'),y+' yılının %'+yp+ek(yp)+' geride kaldı.');}
    }else if(mode==='timer'){
      const r=T.running?Math.max(0,T.endAt-now):T.remain;
      setText($('tDigits'),fmt(r));ring($('tProg'),T.dur?r/T.dur:0);
      setText($('tSub'),T.done?'Süre doldu':T.running?'Kalan süre':r<T.dur?'Duraklatıldı':'Hazır');
      setText($('tStart'),T.running?'Duraklat':r<T.dur&&r>0?'Devam et':'Başlat');
      $('tMin').disabled=$('tSec').disabled=T.running;
    }else if(mode==='sw'){
      const p=fmtSw(sElapsed()),el=$('swDigits');
      if(el.dataset.v!==p[0]+p[1]){el.dataset.v=p[0]+p[1];el.textContent=p[0];const sm=document.createElement('small');sm.textContent=p[1];el.appendChild(sm)}
      setText($('swStart'),S.running?'Durdur':S.acc?'Devam et':'Başlat');$('swLap').disabled=!S.running;
    }else{
      const r=P.running?Math.max(0,P.endAt-now):P.remain,dur=pDur();
      setText($('pDigits'),fmt(r));ring($('pProg'),r/dur);setText($('pPhase'),PH[P.phase]);
      $('pRing').classList.toggle('rest',P.phase!=='work');
      setText($('pStart'),P.running?'Duraklat':r<dur?'Devam et':'Başlat');
      setText($('pNote'),'Tur '+P.round+' / '+cfg.rounds+' · Tamamlanan odak: '+P.done);
    }
  }

  /* ---------- BAŞLANGIÇ ---------- */
  const h=now0.getHours();
  $('greet').textContent=h<5?'İyi geceler':h<12?'Günaydın':h<18?'İyi günler':h<22?'İyi akşamlar':'İyi geceler';
  $('qDate').textContent=now0.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'})+' · günün sözü';
  renderFeature();renderList();pDots();
  const m0=load('qc.mode','clock');showMode(['clock','timer','sw','pomo'].indexOf(m0)>-1?m0:'clock');
  showTab(load('qc.tab','quotes')==='time'?'time':'quotes');
  tick();setInterval(tick,50);
})();
</script>
